name: CI Validation & Compliance Check

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Test & PDF Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Google Chrome
        run: |
          if ! command -v google-chrome &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Verify Compliance Metadata
        run: |
          test -f METADATA.json
          python3 -c "import json; json.load(open('METADATA.json'))"

      - name: Run Test Suite
        run: |
          python3 tests/test_pipeline.py
