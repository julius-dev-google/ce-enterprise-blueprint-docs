name: CI Validation & Compliance Check

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & PDF Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Verify Google Chrome
        run: |
          if ! command -v google-chrome &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
          fi
          google-chrome --version || chromium-browser --version || chromium --version

      - name: Verify Compliance Metadata
        run: |
          test -f METADATA.json
          python3 -c "import json; json.load(open('METADATA.json'))"

      - name: Run Test Suite
        run: |
          python3 tests/test_pipeline.py
